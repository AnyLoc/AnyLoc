[project]
name = "anyloc"
version = "0.1.0"
description = "AnyLoc VPR + DL-VINS offline place-recognition comparison (uv-managed, Jetson-ready)."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "BSD-3-Clause" }

# Scoped to the VPR / DINOv2-VLAD inference path and the AnyLoc/vpr offline
# comparison — NOT the full AnyLoc training stack (wandb/datasets stay in `dev`).
dependencies = [
    "numpy>=1.26.4,<2",
    "opencv-python>=4.10,<5",
    "pillow>=10,<12",
    "pyyaml>=6,<7",
    "scipy>=1.11,<2",
    "scikit-learn>=1.3,<2",
    "matplotlib>=3.8,<4",
    "pandas>=2.0,<3",
    "tqdm>=4.66,<5",
    "natsort>=8.2,<9",
    "einops>=0.7,<1",
    "faiss-cpu>=1.8,<2",
    "transformers>=4.40,<5",
    "timm>=1.0,<2",
    "fast-pytorch-kmeans>=0.2,<1",
    "open-clip-torch>=2.20,<3",
    "clip @ git+https://github.com/openai/CLIP.git",
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
]

[dependency-groups]
notebook = [
    "jupyter>=1.0,<2",
    "ipykernel>=6.29,<7",
]
# Descriptor-distribution UMAP plots (vpr.visualize_codebook). Numba JIT under
# umap-learn — first install is slow (~couple of minutes).
viz = [
    "umap-learn>=0.5,<1",
]
# Cross-format rosbag reader (sqlite3 .db3 + mcap). Pure Python, no ROS env
# needed. Used by vpr.extract_rosbag + scripts/extract_eval_subsets.
eval = [
    "rosbags>=0.10,<1",
]
# Extra deps for AnyLoc/datasets_vg/download_*.py — only needed when fetching
# the held-out VPR benchmarks that train the master codebook. Install with
# ``uv sync --group datasets``.
datasets = [
    "gdown>=5,<6",          # svox
    "scikit-image>=0.22,<1", # eynsham, st_lucia (map_builder.io)
    "mega.py>=1.0,<2",      # st_lucia
    "utm>=0.7,<1",          # san_francisco
    "staticmap>=0.5,<1",    # san_francisco (map_builder)
]
dev = [
    { include-group = "notebook" },
    { include-group = "datasets" },
    { include-group = "viz" },
    { include-group = "eval" },
    "wandb>=0.16,<1",
]

# On aarch64 / Jetson (JetPack 6, CUDA 12.6) torch + torchvision resolve to the
# Jetson AI Lab prebuilt CUDA-native wheels; on x86_64 they fall back to PyPI.
# Mirrors LightGlue-ONNX-Jetson/pyproject.toml.
[tool.uv.sources]
torch = [
    { url = "https://pypi.jetson-ai-lab.io/jp6/cu126/+f/62a/1beee9f2f1470/torch-2.8.0-cp310-cp310-linux_aarch64.whl", marker = "platform_machine == 'aarch64'" },
]
torchvision = [
    { url = "https://pypi.jetson-ai-lab.io/jp6/cu126/+f/907/c4c1933789645/torchvision-0.23.0-cp310-cp310-linux_aarch64.whl", marker = "platform_machine == 'aarch64'" },
]

[tool.uv]
# AnyLoc is a collection of scripts, not an installable package.
package = false
